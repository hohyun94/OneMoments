# Coolify 배포용 — 앱 + PostgreSQL 컨테이너.
# Coolify에서 "Docker Compose" 리소스로 이 파일을 선택하고 아래 환경변수를 주입한다.
# DB는 외부 포트를 열지 않는다(내부 네트워크 전용). TLS/도메인은 Coolify가 담당한다.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      # 예: postgres://onemoments:<url-encoded-password>@postgres:5432/onemoments
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (>= 32 chars)}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (e.g. https://chat.example.com)}
      # 관리자 콘솔 allowlist(쉼표 구분). 비우면 관리자 기능 비활성화.
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      MAX_CIPHERTEXT_BYTES: ${MAX_CIPHERTEXT_BYTES:-16384}
      MAX_ENVELOPES: ${MAX_ENVELOPES:-50}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CHANNEL: ${REDIS_CHANNEL:-onemoments:events}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-8388608}
      ATTACHMENT_DIR: /app/data/attachments
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-local}
      ATTACHMENT_TTL_DAYS: ${ATTACHMENT_TTL_DAYS:-30}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-3600}
    # 첨부 암호문은 DB 밖에 있으므로 반드시 영속 볼륨을 붙인다.
    volumes:
      - attachments:/app/data/attachments
    # Coolify 도메인을 이 서비스의 8080 포트에 연결한다.
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 다중 인스턴스에서는 MIGRATE_ON_START=false 로 두고 마이그레이션을 일회성으로 실행한다.
    command: ["node", "scripts/start.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  # 인스턴스 간 메시지 팬아웃. Dragonfly로 바꾸려면 image만 교체하면 된다(Redis 호환).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 선택: 매일 백업을 남기려면 아래 주석을 해제하거나 Coolify 예약 작업으로 pg_dump 를 실행한다.
  # backup:
  #   image: prodrigestivill/postgres-backup-local:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     SCHEDULE: "@daily"
  #     BACKUP_KEEP_DAYS: "7"
  #     BACKUP_KEEP_WEEKS: "4"
  #     BACKUP_KEEP_MONTHS: "6"
  #   volumes:
  #     - postgres-backups:/backups
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  attachments:
  # postgres-backups:

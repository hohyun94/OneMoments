# 1:1 음성 통화용 TURN(coturn) — 인터넷/제한망 배포용.
#
# 사용법
#   1) 공인 IP 가 있는 서버(VPS 권장)에서 이 파일만 따로 실행한다.
#      CALL_TURN_SECRET 은 앱 서버의 같은 이름 환경변수와 **반드시 동일**해야 한다.
#   2) 앱 서버 환경: CALL_TURN_URLS=turn:<공인IP 또는 도메인>:3478?transport=udp,turns:<도메인>:5349
#   3) 방화벽/보안그룹: 3478/udp, 5349/tcp+udp, 49160-49200/udp 개방
#
#   docker compose -f docker-compose.turn.yml --env-file .env.turn up -d
#
# 주의
# - network_mode: host 를 써야 UDP 릴레이 포트 범위를 그대로 쓸 수 있다.
# - 서버가 NAT 뒤(예: 홈 서버)라면 --external-ip=<공인IP>/<사설IP> 를 추가한다.
# - 443/tcp 는 Coolify 리버스 프록시가 쓰므로 coturn TLS 는 5349 를 쓴다.
#   (turns:443 이 꼭 필요하면 coturn 전용 공인 IP 를 따로 두고 그 IP 의 443 을 쓴다)
services:
  turn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=onemoments
      - --use-auth-secret
      - --static-auth-secret=${CALL_TURN_SECRET:?CALL_TURN_SECRET is required}
      - --fingerprint
      - --no-multicast-peers
      # 사설/링크로컬 대역으로의 릴레이를 막아 SSRF·내부망 접근을 차단한다.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.2.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # 릴레이 대역(좁게 유지하면 방화벽 규칙이 단순해진다).
      - --min-port=49160
      - --max-port=49200
      # 남용 방지: 세션당 대역/사용자 쿼터(필요 시 조정).
      - --max-bps=1000000
      - --user-quota=24
      - --total-quota=480
      # TLS(turns:)를 쓰려면 인증서 경로를 넣는다. 없으면 turns URL 을 빼고 turn 만 쓴다.
      # - --cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
      # - --pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
      # NAT 뒤 서버라면:
      # - --external-ip=<공인IP>/<사설IP>
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onemoments
          POSTGRES_PASSWORD: onemoments
          POSTGRES_DB: onemoments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onemoments -d onemoments_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://onemoments:onemoments@127.0.0.1:5432/onemoments_test
      E2E_DATABASE_URL: postgres://onemoments:onemoments@127.0.0.1:5432/onemoments_e2e
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:test
      - run: pnpm test
      - run: pnpm test:client
      - run: pnpm test:e2e
      - run: pnpm verify
